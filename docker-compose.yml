# Default: app + a local Ollama server. No paid API key.
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.2:3b
#   docker compose exec ollama ollama pull nomic-embed-text
# 16 GB RAM option: ollama pull llama3.1:8b, then set OLLAMA_CHAT_MODEL=llama3.1:8b.
# Tests and CI use PROVIDER=fake and do not start this stack.
# PROVIDER=openai is deprecated. Do not set a paid API key.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PROVIDER: ${PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      DATA_DIR: /data
    volumes:
      - app-data:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  app-data:
  ollama-models:
